# APIs that PANIC at runtime on wasm32-unknown-unknown (these crates compile
# to wasm in kimchi-wasm): use snarky::wasm_instant instead.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "panics on wasm32 — use snarky::wasm_instant::Instant" },
    { path = "std::time::SystemTime::now", reason = "panics on wasm32 — use snarky::wasm_instant::Instant" },
]
